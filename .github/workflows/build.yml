name: Build and validate FLUX 3
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      gpu_smoke:
        description: Run paid disposable Runpod generation and editing tests
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: flux-3-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One image per model generation; they share every layer but the baked profile.
        studio_version: ['1', '2', '3']
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate source
        run: |
          python3 scripts/check-source.py
          python3 scripts/audit-seeds.py
          node scripts/test-workflow-defaults.mjs
      - name: Verify pinned checksums against Hugging Face
        # Gated repositories mask hashes from anonymous callers, so those pins are skipped
        # unless an HF_TOKEN secret for an account that accepted the gate is configured.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/verify-pins.py
      - name: Validate Runpod template parity and gateway handler
        run: |
          python3 -m pip install --quiet aiohttp
          python3 .runpod/test_template_sync.py
          python3 .runpod/test_handler.py
      - name: Free build disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            STUDIO_VERSION=${{ matrix.studio_version }}
          tags: |
            ghcr.io/acdevmedia/flux-comfyui:${{ matrix.studio_version }}
            ghcr.io/acdevmedia/flux-comfyui:${{ matrix.studio_version }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=flux-${{ matrix.studio_version }}
          cache-to: type=gha,mode=max,scope=flux-${{ matrix.studio_version }}
          provenance: true
          sbom: true
      - name: Record image digest
        run: |
          echo 'FLUX ${{ matrix.studio_version }}: ghcr.io/acdevmedia/flux-comfyui@${{ steps.build.outputs.digest }}' \
            >> "$GITHUB_STEP_SUMMARY"
  gpu-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install image validation dependency
        run: python3 -m pip install pillow
      - name: Generate on a disposable Runpod GPU
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_REGISTRY_AUTH_ID: ${{ secrets.RUNPOD_REGISTRY_AUTH_ID }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          STUDIO_VERSION: '3'
        run: python3 scripts/test-runpod.py
      - name: Ensure test pod is deleted
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/test-runpod.py --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: flux-3-gpu-validation
          path: |
            .runtime/*.json
            .runtime/*.png
            .runtime/*.log
